# Apache Virtual Host Configuration
# Place this file in /etc/httpd/conf.d/ (Amazon Linux 2) or /etc/apache2/sites-available/ (Ubuntu)
# Then enable it and restart Apache

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/html
    
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Enable CORS for JSON files (if needed)
    <FilesMatch "\.(json)$">
        Header set Access-Control-Allow-Origin "*"
    </FilesMatch>
    
    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# For Ubuntu, after placing in /etc/apache2/sites-available/:
# sudo a2ensite apache-config.conf
# sudo systemctl reload apache2

# For Amazon Linux 2, after placing in /etc/httpd/conf.d/:
# sudo systemctl restart httpd
