apiVersion: apps/v1
kind: Deployment
metadata:
  name: swe642-assignment1-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swe642-assignment1
  template:
    metadata:
      labels:
        app: swe642-assignment1
    spec:
      containers:
        - name: swe642-assignment1
          image: oliveret/swe642-assignment1:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: swe642-assignment1-service
spec:
  type: LoadBalancer
  selector:
    app: swe642-assignment1
  ports:
    - port: 80
      targetPort: 80